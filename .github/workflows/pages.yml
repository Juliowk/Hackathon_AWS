name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # As telas do protótipo carregam ../design/, então as duas pastas vão lado a lado.
      # A raiz abre o login do protótipo; o demo com painel MCP fica em /demo/.
      - name: Monta o site
        run: |
          mkdir _site
          cp -r prototipo design _site/
          cp -r site _site/demo
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Pauta</title>
          <meta http-equiv="refresh" content="0; url=prototipo/login.html">
          <a href="prototipo/login.html">Abrir o Pauta</a>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
